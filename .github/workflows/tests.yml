name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  HOMEBREW_NO_ANALYTICS: "1"
  DO_NOT_TRACK: "1"

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    runs-on: macos-15 # Apple Silicon; bottles target the oldest supported runner.
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-15-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-15-rubygems-
      - run: test "$(uname -m)" = arm64
      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'
      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_macos-15
          path: '*.bottle.*'
