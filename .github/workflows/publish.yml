name: brew pr-pull

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Reviewed pull request head commit SHA
        required: true

permissions: {}

env:
  HOMEBREW_NO_ANALYTICS: "1"
  DO_NOT_TRACK: "1"

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: pr-pull-${{ inputs.pull_request || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-pull:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'pr-pull' && github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
      # Maintainers must review the complete diff and current head before labeling.
      # pr-pull imports PR formula Ruby in this privileged job; the label is a trust grant.
      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.pull_request.number }}
        run: |
          brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"
      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"
      - name: Push commits
        uses: Homebrew/actions/git-try-push@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          branch: main
